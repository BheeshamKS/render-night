name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --check

  docs:
    name: Documentation Evidence Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docs Evidence Rules
        run: ./tools/check-docs.sh

  clippy:
    name: Clippy Lint (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libasound2-dev libdbus-1-dev pkg-config cmake ninja-build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  python-lint:
    name: Python Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint Check
        run: ruff check resources/python/

      - name: Python Bytecode Compile Check
        run: python -m py_compile resources/python/*.py

  test:
    name: Test Workspace (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CMAKE_GENERATOR: "Ninja"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libasound2-dev libdbus-1-dev pkg-config cmake ninja-build xvfb

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --workspace

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace

  build-app:
    name: Build Application (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: true
    env:
      CMAKE_GENERATOR: "Ninja"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libasound2-dev libdbus-1-dev pkg-config cmake ninja-build xvfb

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Run Smoke Test (Ubuntu with xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum ./target/release/render-night-gui --smoke-test
          xvfb-run --auto-servernum ./target/release/render-night --smoke-test

      - name: Run Smoke Test (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/release/render-night-gui.exe --smoke-test
          ./target/release/render-night.exe --smoke-test

  package-linux:
    name: Package Linux (.deb + AppImage)
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libasound2-dev libdbus-1-dev \
            pkg-config cmake ninja-build file

      # One clean checkout, one build, and the packages are made from exactly
      # those binaries. No restored target/ directory.
      - name: Build Release Binaries (locked)
        run: cargo build --release --locked --workspace

      - name: Package Debian (.deb)
        run: ./packaging/build-deb.sh

      - name: Package AppImage (.AppImage)
        run: ./packaging/build-appimage.sh

      - name: Verify Package Provenance and Payload
        run: ./packaging/verify-packages.sh target/release/render-night_*.deb target/release/Render-Night-*.AppImage

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: render-night-linux-packages
          path: |
            target/release/*.deb
            target/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  container-e2e:
    name: Clean Container (${{ matrix.distro }} · ${{ matrix.kind }} · ${{ matrix.mode }})
    needs: [package-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "22.04"
            kind: deb
            mode: minimal
          - distro: "24.04"
            kind: deb
            mode: minimal
          - distro: "22.04"
            kind: appimage
            mode: minimal
          - distro: "24.04"
            kind: appimage
            mode: minimal
          - distro: "22.04"
            kind: deb
            mode: full
          - distro: "24.04"
            kind: deb
            mode: full
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Packages
        uses: actions/download-artifact@v4
        with:
          name: render-night-linux-packages
          path: dist

      - name: Build Clean Container Image
        run: docker build -t rn-e2e:${{ matrix.distro }} -f tools/e2e/Dockerfile.${{ matrix.distro }} tools/e2e

      - name: Run Packaged App in Clean Container
        run: tools/e2e/run-container.sh ${{ matrix.distro }} ${{ matrix.kind }} ${{ matrix.mode }}

      - name: Upload Container Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.distro }}-${{ matrix.kind }}-${{ matrix.mode }}
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 14
