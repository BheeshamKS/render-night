name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libasound2-dev

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Warnings Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  build-windows:
    name: Build Windows (NSIS + Portable)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries
        run: cargo build --release --bin render-night --bin render-night-gui

      - name: Package Portable ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release/portable
          cp target/release/render-night.exe target/release/portable/
          cp target/release/render-night-gui.exe target/release/portable/
          cp README.md target/release/portable/
          cp LICENSE target/release/portable/
          cp -r resources target/release/portable/
          cd target/release/portable
          7z a "../render-night-${VERSION}-windows-x64-portable.zip" *

      - name: Build NSIS Installer
        shell: bash
        run: |
          makensis packaging/nsis/installer.nsi
          VERSION="${GITHUB_REF_NAME#v}"
          mv render-night-setup-windows-x64.exe "target/release/render-night-${VERSION}-windows-x64-setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            target/release/*.exe
            target/release/*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux (AppImage + DEB)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libasound2-dev

      - name: Build Release Binaries
        run: cargo build --release --bin render-night --bin render-night-gui

      - name: Package Debian (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/linux/build-deb.sh "${VERSION}"

      - name: Package AppImage (.AppImage)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/linux/build-appimage.sh "${VERSION}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/*.deb
            target/release/*.AppImage
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: Build macOS DMG (${{ matrix.target }})
    needs: verify
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --bin render-night --bin render-night-gui

      - name: Package macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./packaging/macos/build-dmg.sh "${{ matrix.arch }}" "${VERSION}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: target/release/*.dmg
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-dist

      - name: Download macOS arm64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: release-dist

      - name: Download macOS x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-artifacts
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*.exe
            release-dist/*.zip
            release-dist/*.deb
            release-dist/*.AppImage
            release-dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
