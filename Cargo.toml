[workspace]
members = [
    "crates/rn-core",
    "crates/rn-mock-blender",
    "crates/rn-spike",
    "crates/rn-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BheeshamKS <bheeshamkumarsajnani3@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/BheeshamKS/Render-Night"

[workspace.dependencies]
# Tokio async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization & Schema contracts
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["preserve_order"] }

# Error handling & Tracing
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Domain utilities
semver = "1.0"
directories = "5.0"
notify = "6.1"
rodio = "0.19"
keepawake = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
libc = "0.2"

# CLI interface
clap = { version = "4.5", features = ["derive", "env"] }

# Testing & Proptest
proptest = "1.4"
insta = { version = "1.39", features = ["json"] }

[workspace.lints.cargo]
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"
missing_lints_inheritance = "allow"


