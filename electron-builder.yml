appId: "com.bheeshamks.rendernight"
productName: "Render Night"
directories:
  output: "release"
  buildResources: "resources"
files:
  - "out/**/*"
  - "resources/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!tests/**/*"
  - "!docs/**/*"
  - "!tools/**/*"
  - "!**/*.test.*"
  - "!**/*.spec.*"

asar: true
asarUnpack: ["**/*.node", "**/*.so", "**/*.dylib"]

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: "nsis"
      arch:
        - x64
    - target: "portable"
      arch:
        - x64
  requestedExecutionLevel: "asInvoker"
  publisherName: "BheeshamKS"
  verifyUpdateCodeSignature: false

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: "dmg"
      arch:
        - arm64
        - x64
  type: "distribution"
  hardenedRuntime: false
  gatekeeperAssessment: false
  identity: null

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: "AppImage"
      arch:
        - x64
    - target: "deb"
      arch:
        - x64
  category: "Graphics"
  maintainer: "BheeshamKS <bheeshamkumarsajnani3@gmail.com>"
  synopsis: "A fast local render queue for Blender"
  description: "Render Night is a fast local render queue for Blender with a Blender-native look."

# ── Compression ──────────────────────────────────────────────────────────────
compression: "normal"
npmRebuild: false
